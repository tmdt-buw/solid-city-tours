name: City Tours CI and Release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hoelk-f"
          cache: "npm"
      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Missing repository secret NPM_TOKEN." >&2
            exit 1
          fi
          npm whoami --registry https://npm.pkg.github.com >/dev/null
      - name: Wait for exact Catalog dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_VERSION=$(node - <<'NODE'
          const version = require('./package.json').dependencies['@hoelk-f/semantic-data-catalog'];
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Catalog dependency must use an exact version, got ${version}.`);
          }
          process.stdout.write(version);
          NODE
          )

          lookup_exact_version() {
            local output status
            set +e
            output=$(npm view "$1" version --registry https://npm.pkg.github.com --loglevel=error 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf '%s' "$output"
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi '(^|[[:space:]])E404|404 Not Found'; then
              return 1
            fi

            printf 'npm view failed for %s:\n%s\n' "$1" "$output" >&2
            return 2
          }

          for attempt in $(seq 1 60); do
            if PUBLISHED_VERSION=$(lookup_exact_version "@hoelk-f/semantic-data-catalog@${CATALOG_VERSION}"); then
              if [ "$PUBLISHED_VERSION" != "$CATALOG_VERSION" ]; then
                echo "Registry returned unexpected version ${PUBLISHED_VERSION:-<empty>} for Catalog ${CATALOG_VERSION}." >&2
                exit 1
              fi
              echo "Catalog package ${CATALOG_VERSION} is available."
              break
            else
              LOOKUP_STATUS=$?
            fi

            if [ "$attempt" -eq 60 ]; then
              if [ "$LOOKUP_STATUS" -eq 1 ]; then
                echo "Catalog package ${CATALOG_VERSION} did not become visible in time." >&2
              else
                echo "Catalog registry lookup kept failing; availability could not be determined." >&2
              fi
              exit 1
            fi

            sleep 10
          done
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm test
      - run: npm run build

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hoelk-f"
          cache: "npm"
      - name: Check release secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MANAGER_TOKEN: ${{ secrets.MANAGER_DISPATCH_TOKEN || secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in NPM_TOKEN MANAGER_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing repository secret ${secret_name}." >&2
              exit 1
            fi
          done

          NODE_AUTH_TOKEN="$NPM_TOKEN" npm whoami --registry https://npm.pkg.github.com >/dev/null
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${MANAGER_TOKEN}" \
            https://api.github.com/repos/hoelk-f/solid-dataspace-manager >/dev/null
      - name: Wait for exact Catalog dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_VERSION=$(node - <<'NODE'
          const version = require('./package.json').dependencies['@hoelk-f/semantic-data-catalog'];
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Catalog dependency must use an exact version, got ${version}.`);
          }
          process.stdout.write(version);
          NODE
          )

          lookup_exact_version() {
            local output status
            set +e
            output=$(npm view "$1" version --registry https://npm.pkg.github.com --loglevel=error 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf '%s' "$output"
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi '(^|[[:space:]])E404|404 Not Found'; then
              return 1
            fi

            printf 'npm view failed for %s:\n%s\n' "$1" "$output" >&2
            return 2
          }

          for attempt in $(seq 1 60); do
            if PUBLISHED_VERSION=$(lookup_exact_version "@hoelk-f/semantic-data-catalog@${CATALOG_VERSION}"); then
              if [ "$PUBLISHED_VERSION" != "$CATALOG_VERSION" ]; then
                echo "Registry returned unexpected version ${PUBLISHED_VERSION:-<empty>} for Catalog ${CATALOG_VERSION}." >&2
                exit 1
              fi
              echo "Catalog package ${CATALOG_VERSION} is available."
              break
            else
              LOOKUP_STATUS=$?
            fi

            if [ "$attempt" -eq 60 ]; then
              if [ "$LOOKUP_STATUS" -eq 1 ]; then
                echo "Catalog package ${CATALOG_VERSION} did not become visible in time." >&2
              else
                echo "Catalog registry lookup kept failing; availability could not be determined." >&2
              fi
              exit 1
            fi

            sleep 10
          done
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate package version
        id: package-version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = require('./package.json');

          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const parse = (version, label) => {
            if (!stableSemver.test(version)) {
              throw new Error(`${label} must be a stable x.y.z version, got ${version || '<empty>'}.`);
            }
            return version.split('.').map((part) => BigInt(part));
          };
          const compare = (left, right) => {
            const a = parse(left, 'Current version');
            const b = parse(right, 'Published version');
            for (let index = 0; index < 3; index += 1) {
              if (a[index] > b[index]) return 1;
              if (a[index] < b[index]) return -1;
            }
            return 0;
          };

          const readPublishedVersion = (spec) => {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                return execFileSync(
                  'npm',
                  ['view', spec, 'version', '--registry', 'https://npm.pkg.github.com', '--loglevel=error'],
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] },
                ).trim();
              } catch (error) {
                const diagnostic = `${error.stdout || ''}\n${error.stderr || ''}\n${error.message || ''}`;
                if (/(^|\s)E404(\s|$)|404 Not Found/i.test(diagnostic)) {
                  if (attempt === 3) return '';
                  Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
                  continue;
                }
                if (attempt === 3) {
                  throw new Error(`Unable to query ${spec}; registry availability is unknown. ${diagnostic.trim()}`);
                }
                Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
              }
            }
            throw new Error(`Unable to query ${spec}.`);
          };

          parse(pkg.version, 'package.json version');
          const latest = readPublishedVersion('@hoelk-f/city-tours');
          const exact = readPublishedVersion(`@hoelk-f/city-tours@${pkg.version}`);

          console.log(`Current version: ${pkg.version}`);
          if (latest) {
            console.log(`Published version: ${latest}`);
            if (compare(pkg.version, latest) < 0) {
              throw new Error(
                `package.json version (${pkg.version}) is older than the published version (${latest}).`,
              );
            }
          }

          if (exact && exact !== pkg.version) {
            throw new Error(`Exact package lookup returned ${exact}, expected ${pkg.version}.`);
          }
          if (latest === pkg.version && !exact) {
            throw new Error(`Latest points to ${pkg.version}, but the exact package lookup returned 404.`);
          }

          const packageExists = exact === pkg.version;
          if (packageExists && process.env.RELEASE_EVENT !== 'workflow_dispatch') {
            throw new Error(
              `Version ${pkg.version} is already published. Bump the version for a normal main push, or use workflow_dispatch to rebuild the existing release.`,
            );
          }
          console.log(`Exact version already published: ${packageExists}`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `package_version=${pkg.version}\npackage_exists=${packageExists}\n`,
          );
          NODE
      - name: Build package
        run: npm run build
      - name: Publish package to GitHub Packages
        if: steps.package-version.outputs.package_exists != 'true'
        run: npm publish ./dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            son1i/city-tours:latest
            son1i/city-tours:${{ steps.package-version.outputs.package_version }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
      - name: Wait for package and trigger manager rebuild
        env:
          MANAGER_TOKEN: ${{ secrets.MANAGER_DISPATCH_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          lookup_exact_version() {
            local output status
            set +e
            output=$(npm view "$1" version --registry https://npm.pkg.github.com --loglevel=error 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf '%s' "$output"
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi '(^|[[:space:]])E404|404 Not Found'; then
              return 1
            fi

            printf 'npm view failed for %s:\n%s\n' "$1" "$output" >&2
            return 2
          }

          for attempt in $(seq 1 60); do
            if PUBLISHED_VERSION=$(lookup_exact_version "@hoelk-f/city-tours@${PACKAGE_VERSION}"); then
              if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
                echo "Registry returned unexpected version ${PUBLISHED_VERSION:-<empty>} for Tours ${PACKAGE_VERSION}." >&2
                exit 1
              fi
              break
            else
              LOOKUP_STATUS=$?
            fi

            if [ "$attempt" -eq 60 ]; then
              if [ "$LOOKUP_STATUS" -eq 1 ]; then
                echo "Tours package ${PACKAGE_VERSION} did not become visible in time." >&2
              else
                echo "Tours registry lookup kept failing; availability could not be determined." >&2
              fi
              exit 1
            fi

            sleep 10
          done

          PAYLOAD=$(node -e 'process.stdout.write(JSON.stringify({event_type: "city-tours-released", client_payload: {package: "@hoelk-f/city-tours", version: process.env.PACKAGE_VERSION}}))')
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${MANAGER_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hoelk-f/solid-dataspace-manager/dispatches \
            --data "$PAYLOAD"
