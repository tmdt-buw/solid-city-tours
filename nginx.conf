server {
    listen 3006;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 /solid-tours/;
    }

    location = /solid-tours {
        return 301 /solid-tours/;
    }

    location /solid-tours/ {
        try_files $uri $uri/ /solid-tours/index.html;
    }
}

