server {
    listen 3006;
    server_name _;
    root /usr/share/nginx/html;

    # Preserve old standalone links, including their query string.
    rewrite ^/solid-tours(/.*)?$ /city-tours$1 permanent;

    location = / {
        return 302 /city-tours/;
    }

    location = /city-tours {
        return 301 /city-tours/$is_args$args;
    }

    location /city-tours/ {
        try_files $uri $uri/ /city-tours/index.html;
    }
}

